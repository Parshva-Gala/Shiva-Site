# SHIVA: upstream jobs are inactive outside homarr-labs/homarr; no target deployment is enabled.
name: "[Conventions] Semantic PRs"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-pull-request-title:
    if: ${{ github.repository == 'homarr-labs/homarr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
